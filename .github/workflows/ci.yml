name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run backend tests (Docker)
        run: docker compose run --rm backend sh -c "pip install -r requirements-dev.txt && pytest"

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run frontend Jest tests (Docker)
        run: docker compose run --rm frontend sh -c "npm install && npm test"
      - name: Run frontend Playwright tests (Docker)
        run: docker compose run --rm frontend sh -c "npx playwright install --with-deps chromium && npm run test:e2e"
