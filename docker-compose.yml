services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inkb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inkb}
      POSTGRES_DB: ${POSTGRES_DB:-inkb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://inkb:inkb@db:5432/inkb}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      CHUNK_SIZE: ${CHUNK_SIZE:-1200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      CHAT_TOP_K: ${CHAT_TOP_K:-5}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db

  worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://inkb:inkb@db:5432/inkb}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      CHUNK_SIZE: ${CHUNK_SIZE:-1200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    command: python -m app.worker
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    environment:
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-19006}:19006"
    volumes:
      - ./frontend:/app
    command: npm run web -- --host lan --port 19006
    depends_on:
      - backend

volumes:
  db_data:
